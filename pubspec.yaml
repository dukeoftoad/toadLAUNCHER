name: toadlauncher
description: "toadLAUNCHER — part of the toad family. Hand-made, calm, instant. Offline-first, no ads, no analytics, no network permission."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
    - family: Patrick Hand
      fonts:
        - asset: assets/fonts/PatrickHand.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
