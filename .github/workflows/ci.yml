name: toadlauncher CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Analyze · Test · Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android licenses (AGP auto-installs platform 37)
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;latest" > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toadlauncher-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    name: Signed release
    # Runs when a v* tag is pushed (git tag v1.0.0 && git push origin v1.0.0).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.50.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build signed universal APK
        run: flutter build apk --release

      - name: Stage release files
        id: stage
        run: |
          VER=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/toadlauncher-v${VER}-universal-install.apk"
          sha256sum "dist/toadlauncher-v${VER}-universal-install.apk" \
             > "dist/toadlauncher-v${VER}-universal-install.apk.sha256"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: toadLAUNCHER v${{ steps.stage.outputs.version }}
          body: |
            toadLAUNCHER — part of the toad family. Hand-made, calm, instant.

            **Install**
            1. Download `toadlauncher-v*-universal-install.apk` (universal: works on every phone architecture).
            2. Updating from v0.9.0-beta or newer installs right over it — same committed release keystore. Only pre-v0.9 CI builds (random debug keys) need an uninstall first.
            3. Allow "Install unknown apps" for your browser/file manager when asked.
            4. Requires Android 8.0+ (minSdk 26). Open the APK, install, then set toadLAUNCHER as your Home app.

            Updates arrive in-app: Settings → Device & updates, or the banner on your home screen.
            Offline-first · no ads · no analytics · **no INTERNET permission**.
          files: |
            dist/toadlauncher-v${{ steps.stage.outputs.version }}-universal-install.apk
            dist/toadlauncher-v${{ steps.stage.outputs.version }}-universal-install.apk.sha256
